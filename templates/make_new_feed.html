{% extends "base.html" %}
{% block title %}Create New Feed - Study Reels{% endblock %}

{% block content %}
<div class="page-header">
  <h4>Create New Feed</h4>
</div>
<div class="mt-3">
  <form action="{{ url_for('generate_feed') }}" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="topic">Enter your topic or question:</label>
      <input type="text" class="form-control" id="topic" name="topic" placeholder="E.g., Quantum Physics" required>
    </div>
    <!-- <div class="form-group">
      <label for="document">Upload a document (optional):</label>
      <input type="file" class="form-control-file" id="document" name="document">
    </div> -->
    <div class="form-group">
      <label for="level">Select your level:</label>
      <select class="form-control" id="level" name="level">
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Generate Feed</button>
  </form>
</div>
{% endblock %}
